<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Marketing Toolbox</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"
    />
  </head>

  <body>
    <header class="container">
      <h5><a href="index.html">Tripwise Tools</a></h5>
      <nav>
        <ul>
          <li><a href="speed.html">Average Speed</a></li>
          <li><a href="estimate.html">ETA</a></li>
          <li><a href="fuelCost.html">Fuel Cost</a></li> 
          <li><a href="itinerary.html">Itinerary Cost</a></li>
      </nav>
    </header>

    <main class="container">
      <section>
        <h5>Average Speed Calculator</h5>
        <label for="distance">Distance (km):</label>
        <input type="number" id="distance"/> 
        <label for="time">Time (hours):</label>
        <input type="number" id="time" /> 
        <button id="calculate" type="submit">Calculate Speed</button>
        <p id="result"></p>
      </section>
      
    </main>

    <footer class="container">
      <small>
        Go from zero to hero at full stack development with
        <a href="https://neog.camp">neog.camp</a>
      </small>
    </footer>
    <script>

        function calculateSpeed(){
        const distanceElement = document.getElementById("distance");
        const timeElement = document.getElementById("time");
        const resultElement = document.getElementById("result");


        const distanceInKms = distanceElement.value;
        const timeInHours = timeElement.value;

        const speed = distanceInKms / timeInHours;
        resultElement.innerText = "Average speed: " + speed + " km/h";
        }
       
        const calculateBtn = document.getElementById("calculate");
     

       
        calculateBtn.addEventListener("click", calculateSpeed);


        </script>

  </body>
</html>
